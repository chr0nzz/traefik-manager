openapi: 3.1.0
info:
  title: Traefik Manager API
  version: 1.13.3
  description: |
    REST API powering the Traefik Manager web UI and official mobile app.

    All endpoints are relative to your Traefik Manager base URL (e.g. `https://manager.example.com`).

    ## Authentication

    Two methods are supported:

    **API key** *(recommended for scripts and apps)* - generate a key in **Settings → Authentication → API Key** and send it as a header. API keys bypass CSRF checks.

    **Session cookie** - log in via the web UI. The browser session is used automatically.

    ## CSRF

    State-changing endpoints (POST/DELETE) require a CSRF token when using session auth. Send it as `X-CSRF-Token`. API key requests skip this entirely.

    ## Response format

    All endpoints return JSON. Successful mutations return at minimum `{"ok": true}`. Errors return `{"ok": false, "message": "..."}` or `{"error": "..."}` with an appropriate HTTP status code.

servers:
  - url: '{protocol}://{host}'
    description: Your Traefik Manager instance
    variables:
      protocol:
        default: https
        enum: [https, http]
        description: HTTP or HTTPS
      host:
        default: manager.example.com
        description: Hostname (and optional port) of your Traefik Manager

security:
  - ApiKey: []
  - Session: []

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Generate a key in Settings → Authentication → API Key.
    Session:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie set after logging in via the web UI.

  responses:
    Unauthorized:
      description: |
        Not authenticated, or the session expired. Every `/api/` endpoint answers
        with this instead of redirecting to the login page. Treat it as
        "log in again", never as an empty result.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error: { type: string, example: Not authenticated }
              auth_required: { type: boolean, example: true }

  schemas:
    OkResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }

    ErrorResponse:
      type: object
      properties:
        ok: { type: boolean, example: false }
        message: { type: string, example: "Something went wrong" }

    RouteOverride:
      type: object
      description: |
        Per-route dashboard overrides. Every field is optional; an absent field means
        "use the derived default". Keys of `route_overrides` are route ids
        (`<config-file>::<router-name>`, or the router name on a single-file install).
      properties:
        display_name:
          type: string
          description: Replaces the route name on the card.
          example: Jellyfin
        icon_type:
          type: string
          enum: [auto, slug, url]
          default: auto
          description: |
            How to resolve the icon. `auto` derives a slug from the route name,
            `slug` uses `icon_slug`, `url` uses `icon_url`.
        icon_slug:
          type: string
          description: selfh.st icon slug, used when `icon_type` is `slug`.
          example: jellyfin
        icon_url:
          type: string
          description: Absolute image URL, used when `icon_type` is `url`.
        group:
          type: string
          description: Category the card is filed under. Matches a custom group name or a built-in one.
          example: Media
        url:
          type: string
          description: |
            Overrides the URL the card opens. Must start with `http://` or `https://` -
            any other value is dropped on save.
          example: https://jellyfin.example.com
        hidden:
          type: boolean
          default: false
          description: Hide the card from both dashboard views. The route keeps running.
        link_disabled:
          type: boolean
          default: false
          description: Render the card but make it non-clickable.

    DashboardConfig:
      type: object
      properties:
        custom_groups:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: Media }
        route_overrides:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RouteOverride" }
        tm_route_name:
          type: string
          readOnly: true
          description: |
            Router that points at Traefik Manager itself, so a client can give it
            TM's own icon instead of deriving one. Read-only - ignored on save.
          example: traefik-manager

    Route:
      type: object
      properties:
        id: { type: string, example: "my-app" }
        name: { type: string, example: "my-app" }
        enabled: { type: boolean }
        protocol: { type: string, enum: [http, tcp, udp] }
        rule: { type: string, example: "Host(`app.example.com`)" }
        target: { type: string, example: "http://192.168.1.10:8080", description: "First backend. Kept for backwards compatibility; equivalent to servers[0]." }
        servers:
          type: array
          items: { type: string }
          description: "All backends for the service. URLs for HTTP, host:port addresses for TCP and UDP."
          example: ["http://192.168.1.10:8080", "http://192.168.1.11:8080"]
        sticky:
          type: object
          description: "loadBalancer.sticky.cookie, or an empty object when sticky sessions are off. HTTP only."
          example: { name: "tm_sticky", secure: true, httpOnly: true }
        stickyEnabled: { type: boolean, description: "Whether a sticky block is present. HTTP only." }
        healthCheck:
          type: object
          description: "loadBalancer.healthCheck, or an empty object when no health check is configured. HTTP only."
          example: { path: "/health", interval: "10s", timeout: "3s" }
        priority: { type: [integer, "null"], description: "Router priority, or null when unset. HTTP and TCP only." }
        middlewares: { type: array, items: { type: string } }
        tls: { type: boolean }
        certResolver: { type: string, description: "ACME resolver name, or empty if using external certs." }
        passHostHeader: { type: boolean }
        configFile: { type: string }

    Agent:
      type: object
      description: "A registered remote server. Secrets are returned redacted as `***`."
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "vps-frankfurt" }
        url: { type: string, example: "https://agent.example.com:8090", description: "Base URL of the agent, no trailing slash." }
        api_key: { type: string, example: "***", description: "Always redacted. The raw key is returned once, on create and on rotate." }
        created_at: { type: string, format: date-time }
        install_method: { type: string, enum: [cli, manual], description: "How the agent was added: the tm CLI install, or the manual compose generator." }
        traefik_api_url: { type: string, example: "http://traefik:8080" }
        traefik_api_user: { type: string, description: "Username for a Traefik API behind basic auth." }
        traefik_api_password: { type: string, example: "***", description: "Always redacted. Send \"\" or \"***\" to keep the stored value." }
        traefik_insecure_skip_verify: { type: boolean }
        cert_resolver: { type: string, description: "Optional per-agent resolver, for resolvers no route uses yet." }
        config_path: { type: string, example: "/app/config" }
        static_config_path: { type: string }
        acme_json_path: { type: string }
        access_log_path: { type: string }
        plugins_dir: { type: string }
        backup_dir: { type: string }
        backup_keep_count: { type: string }
        restart_method: { type: string, enum: ["", proxy, poison-pill, socket] }
        traefik_container: { type: string }
        docker_host: { type: string }
        signal_file_path: { type: string }
        crowdsec_lapi_url: { type: string }
        crowdsec_api_key: { type: string, example: "***" }
        crowdsec_machine_id: { type: string }
        crowdsec_machine_password: { type: string, example: "***" }
        git_backup_enabled: { type: boolean }
        git_backup_repo: { type: string }
        git_backup_branch: { type: string }
        git_backup_username: { type: string }
        git_backup_token: { type: string, example: "***" }
        git_backup_auto_push: { type: boolean }
        git_backup_commit_message: { type: string }
        git_host_backup: { type: boolean, description: "Push this agent's config to the Host's repository instead of its own." }
        git_host_branch: { type: string, description: "Branch used on the Host repository. Must be unique per server." }
        tma_port: { type: string }
        tma_rate_limit: { type: string }
        domains:
          type: array
          items: { type: string }
          description: "Domains offered in the route form for this server."

    UiPrefs:
      type: object
      description: "Display preferences. Unknown keys are dropped."
      properties:
        showStatCards: { type: boolean, default: true }
        compactStatCards: { type: boolean, default: false }
        showEntrypoints: { type: boolean, default: true }
        showDocsLink: { type: boolean, default: true }
        showApiLink: { type: boolean, default: false }
        showShortcutsBtn: { type: boolean, default: true }
        showIpDiagBtn: { type: boolean, default: true }
        showTraefikBadge: { type: boolean, default: true }
        showTmBadge: { type: boolean, default: true }
        showRouteIcons: { type: boolean, default: false }
        routeViewMode: { type: string, enum: [grid, list], default: grid }
        mwViewMode: { type: string, enum: [grid, list], default: grid }
        svcViewMode: { type: string, enum: [grid, list], default: grid }

    Middleware:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        yaml: { type: string }
        configFile: { type: string }

    Notification:
      type: object
      properties:
        ts: { type: string, example: "2026-04-13 20:25:03" }
        type: { type: string, example: "route_saved" }
        msg: { type: string, example: "Route my-app saved" }

    NotificationChannel:
      type: object
      description: "A notification delivery target. Secrets are returned redacted as `***`."
      properties:
        id: { type: string, example: "ch_1a2b3c4d", description: "Generated server-side on create." }
        name: { type: string, example: "Ops Discord", maxLength: 60, description: "Falls back to the kind when left empty." }
        kind: { type: string, enum: [discord, slack, ntfy, generic, gotify, pushover, pushbullet, telegram] }
        enabled: { type: boolean, default: true }
        url: { type: string, maxLength: 500, description: "Webhook or server URL. Required for discord, slack, ntfy, generic and gotify." }
        token: { type: string, example: "***", description: "Gotify app token, Pushover app token, Pushbullet access token, or Telegram bot token." }
        token2: { type: string, example: "***", description: "Pushover user key, or Telegram chat id." }
        username: { type: string, maxLength: 100, description: "Optional HTTP basic auth user for url-based kinds." }
        password: { type: string, example: "***" }
        categories:
          type: array
          description: "Event categories this channel accepts. Empty means every category."
          items: { type: string, enum: [config, backup, security, traefik, certs, crowdsec, agent, update] }
        min_severity: { type: string, enum: [info, success, warning, error], default: info }
        digest: { type: string, enum: [immediate, hourly, daily], default: immediate }
        quiet_hours: { type: string, example: "23:00-07:00", description: "HH:MM-HH:MM window, or empty for none. Wraps past midnight." }
        break_through: { type: boolean, default: false, description: "Deliver error events even during quiet hours." }

    BackupFile:
      type: object
      properties:
        name: { type: string, example: "backup_2026-03-24T22-00-00.yml" }
        size: { type: integer, example: 1024 }
        modified: { type: string, example: "2026-03-24T22:00:00" }

tags:
  - name: Authentication
    description: Password, TOTP 2FA, API keys, and OIDC.
  - name: Traefik
    description: Live read-only data proxied from the Traefik API.
  - name: Routes & Middlewares
    description: Create, edit, delete, and toggle managed routes and middlewares.
  - name: Dashboard
    description: Dashboard configuration - custom groups and per-route icon/name overrides.
  - name: Settings
    description: Application settings including domains, resolvers, file paths, and tabs.
  - name: Backups
    description: Create, list, restore, and delete configuration backups.
  - name: Notifications
    description: In-app event log.
  - name: Static Config
    description: Read and edit Traefik's static config (`traefik.yml`) via the Static Config editor.
  - name: CrowdSec
    description: Active decisions and alerts from a CrowdSec LAPI, with unban support.
  - name: Agents
    description: |
      Managing remote Traefik Manager Agents (TMA) from this instance. These run
      on the Host and are not the agent's own API - for that see the
      [Agent API reference](https://traefik-manager.xyzlab.dev/api-agent.html).
  - name: Utility
    description: Version info, router names, and connection testing.

paths:

  # ─── Authentication ───────────────────────────────────────────────────────

  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: Change the login password. Rate-limited to 10/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
                confirm_password: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api/auth/toggle:
    post:
      tags: [Authentication]
      summary: Toggle password authentication
      description: Enable or disable password authentication entirely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_enabled: { type: boolean }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  auth_enabled: { type: boolean }

  /api/auth/otp/status:
    get:
      tags: [Authentication]
      summary: TOTP status
      description: Check whether TOTP two-factor authentication is enabled.
      responses:
        "200":
          description: TOTP status
          content:
            application/json:
              schema:
                type: object
                properties:
                  otp_enabled: { type: boolean, example: false }

  /api/auth/otp/setup:
    post:
      tags: [Authentication]
      summary: Generate TOTP secret
      description: Generate a TOTP secret and QR code URI for scanning with an authenticator app.
      responses:
        "200":
          description: Secret and QR URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, example: "BASE32SECRET" }
                  uri: { type: string, example: "otpauth://totp/TraefikManager?secret=..." }

  /api/auth/otp/enable:
    post:
      tags: [Authentication]
      summary: Enable TOTP
      description: Confirm and activate TOTP using a code from the authenticator app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api/auth/otp/disable:
    post:
      tags: [Authentication]
      summary: Disable TOTP
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api/auth/apikey/status:
    get:
      tags: [Authentication]
      summary: List API keys
      description: List all active API keys. Full keys are never returned after generation.
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  count: { type: integer }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: "My Phone" }
                        preview: { type: string, example: "abcd1234...ef56" }
                        created_at: { type: string, example: "2026-04-03 12:00" }

  /api/auth/apikey/generate:
    post:
      tags: [Authentication]
      summary: Generate API key
      description: Generate a new API key for a named device. Up to 10 keys can exist. Rate-limited to 5/hour. The full key is returned once - store it securely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name: { type: string, example: "My Phone" }
      responses:
        "200":
          description: Generated key
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  key: { type: string, example: "tm_abcdef123456..." }

  /api/auth/apikey/revoke:
    post:
      tags: [Authentication]
      summary: Revoke API key
      description: Revoke a specific API key by its preview string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview]
              properties:
                preview: { type: string, example: "abcd1234...ef56" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /api/auth/oidc:
    get:
      tags: [Authentication]
      summary: Get OIDC config
      description: Get current OIDC configuration. The client secret is never returned.
      responses:
        "200":
          description: OIDC config
          content:
            application/json:
              schema:
                type: object
                properties:
                  oidc_enabled: { type: boolean }
                  oidc_provider_url: { type: string }
                  oidc_client_id: { type: string }
                  oidc_client_secret_set: { type: boolean }
                  oidc_display_name: { type: string }
                  oidc_allowed_emails: { type: string }
                  oidc_allowed_groups: { type: string }
                  oidc_groups_claim: { type: string }
    post:
      tags: [Authentication]
      summary: Save OIDC config
      description: Save OIDC configuration. Leave `oidc_client_secret` blank to keep the existing secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oidc_enabled: { type: boolean }
                oidc_provider_url: { type: string }
                oidc_client_id: { type: string }
                oidc_client_secret: { type: string }
                oidc_display_name: { type: string }
                oidc_allowed_emails: { type: string }
                oidc_allowed_groups: { type: string }
                oidc_groups_claim: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /api/auth/oidc/test:
    post:
      tags: [Authentication]
      summary: Test OIDC provider
      description: Test connectivity to an OIDC provider's discovery endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_url]
              properties:
                provider_url: { type: string, example: "https://accounts.google.com" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  issuer: { type: string }
                  error: { type: string }

  # ─── Traefik ──────────────────────────────────────────────────────────────

  /api/traefik/overview:
    get:
      tags: [Traefik]
      summary: Overview
      description: Traefik dashboard overview - router/service/middleware counts, features, version.
      responses:
        "200":
          description: Overview object from Traefik API

  /api/traefik/routers:
    get:
      tags: [Traefik]
      summary: All routers
      description: All routers across HTTP, TCP, and UDP protocols.
      responses:
        "200":
          description: Routers by protocol
          content:
            application/json:
              schema:
                type: object
                properties:
                  http: { type: array, items: { type: object } }
                  tcp:  { type: array, items: { type: object } }
                  udp:  { type: array, items: { type: object } }

  /api/traefik/services:
    get:
      tags: [Traefik]
      summary: All services
      description: All services across HTTP, TCP, and UDP protocols.
      responses:
        "200":
          description: Services by protocol
          content:
            application/json:
              schema:
                type: object
                properties:
                  http: { type: array, items: { type: object } }
                  tcp:  { type: array, items: { type: object } }
                  udp:  { type: array, items: { type: object } }

  /api/traefik/middlewares:
    get:
      tags: [Traefik]
      summary: All middlewares
      description: All middlewares across HTTP and TCP.
      responses:
        "200":
          description: Middlewares by protocol
          content:
            application/json:
              schema:
                type: object
                properties:
                  http: { type: array, items: { type: object } }
                  tcp:  { type: array, items: { type: object } }

  /api/traefik/entrypoints:
    get:
      tags: [Traefik]
      summary: Entrypoints
      description: All configured entrypoints.
      responses:
        "200":
          description: Entrypoint list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, example: "websecure" }
                    address: { type: string, example: ":443" }

  /api/traefik/version:
    get:
      tags: [Traefik]
      summary: Version
      responses:
        "200":
          description: Traefik version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  Version: { type: string, example: "3.2.0" }
                  Codename: { type: string }
                  startDate: { type: string }

  /api/traefik/ping:
    get:
      tags: [Traefik]
      summary: Ping
      description: Ping the Traefik API and return latency.
      responses:
        "200":
          description: Ping result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  latency_ms: { type: integer, example: 3 }

  /api/traefik/router/{protocol}/{name}:
    get:
      tags: [Traefik]
      summary: Router details
      description: Get details for a specific router.
      parameters:
        - name: protocol
          in: path
          required: true
          schema: { type: string, enum: [http, tcp, udp] }
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: Router name (URL-encoded)
      responses:
        "200":
          description: Router object from Traefik API

  /api/plugins/catalog:
    get:
      tags: [Traefik]
      summary: Plugin catalog versions
      description: Latest known version per plugin module, from the Traefik plugin catalog, cached for 24 hours. Returns an empty map when the catalog is unreachable.
      responses:
        "200":
          description: Module to latest-version map
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: object
                    additionalProperties:
                      type: string
  /api/traefik/plugins:
    get:
      tags: [Traefik]
      summary: Plugins
      description: List plugins defined under `experimental.plugins` in the Traefik static config. Requires `STATIC_CONFIG_PATH` to be set.
      responses:
        "200":
          description: Plugin list
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        moduleName: { type: string }
                        version: { type: string }
                  error: { type: string }

  /api/traefik/certs:
    get:
      tags: [Traefik]
      summary: TLS certificates
      description: List TLS certificates from ACME (`acme.json`) and file-based (`tls.yml`) sources.
      responses:
        "200":
          description: Certificate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  certs:
                    type: array
                    items:
                      type: object
                      properties:
                        resolver: { type: string, example: "cloudflare" }
                        main: { type: string, example: "example.com" }
                        sans: { type: array, items: { type: string } }
                        not_after: { type: string, example: "2026-04-06T12:00:00Z" }
                        certFile: { type: string }

  /api/traefik/logs:
    get:
      tags: [Traefik]
      summary: Access logs
      description: Tail Traefik access logs. Requires `ACCESS_LOG_PATH` to be set.
      parameters:
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines: { type: array, items: { type: string } }
                  error: { type: string }

  # ─── Routes & Middlewares ─────────────────────────────────────────────────

  /api/configs:
    get:
      tags: [Routes & Middlewares]
      summary: List config files
      description: List all loaded dynamic config files.
      responses:
        "200":
          description: Config file list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        path: { type: string }
                  configDirSet: { type: boolean }

  /api/routes:
    get:
      tags: [Routes & Middlewares]
      summary: Get all routes and middlewares
      description: |
        Get all managed routes and middlewares from all loaded config files.

        `id` is prefixed as `configFile::name` when multiple config files are loaded (e.g. `routes.yml::my-app`).
        Strip the prefix before using the name as a YAML key.
      responses:
        "200":
          description: Routes and middlewares
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items: { $ref: "#/components/schemas/Route" }
                  middlewares:
                    type: array
                    items: { $ref: "#/components/schemas/Middleware" }

  /api/routes/{route_id}/toggle:
    post:
      tags: [Routes & Middlewares]
      summary: Enable / disable route
      description: Enable or disable a route without deleting it. Configuration is preserved in `manager.yml`.
      parameters:
        - name: route_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enable]
              properties:
                enable: { type: boolean }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /save:
    post:
      tags: [Routes & Middlewares]
      summary: Create or update route
      description: |
        Create a new route or update an existing one.

        A service can have several backends. Send them in the `backendsJson*`
        field matching the protocol; it takes precedence over
        `targetIp`/`targetPort`, which stay supported for single-backend clients.

        Clients that omit `backendsJson*` on an edit only replace the **first**
        backend - any additional backends, plus `sticky`, `healthCheck`, and
        `priority`, are preserved rather than dropped.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                serviceName: { type: string, description: "Route/service name" }
                subdomain: { type: string, description: "Hostname (e.g. app.example.com)" }
                targetIp: { type: string, description: "Single backend host. Ignored when the matching backendsJson* field is sent." }
                targetPort: { type: string }
                serviceRef: { type: string, description: "Name of an existing service for the router to point at. When sent, no <name>-service is created and the backend fields are ignored. Sent empty it is a 400." }
                backendsJsonHttp:
                  type: string
                  description: |
                    JSON object describing the HTTP service. Keys:
                    `servers` (array of `{scheme, host, port}` - a `host` already starting with
                    `http://`/`https://` is used verbatim), `sticky`
                    (`{enabled, cookieName, secure, httpOnly}`), `healthCheck`
                    (`{enabled, path, interval, timeout}` - Go durations, a bare number is read as
                    seconds), and `priority` (integer). Omitted or invalid JSON falls back to
                    `targetIp`/`targetPort`. Rows with an empty `host` are skipped.

                    `children` (array of `{kind, address, scheme, name, weight, percent}`) turns the
                    route's service into a composite of the type in `compositeType` (`weighted`,
                    `mirroring` or `failover`). A `manual` child becomes its own
                    `<route>-backend-<n>` service; a `service` child is referenced by `name` and
                    never copied. Sending `children: []` reverts the route to a plain
                    `loadBalancer`. The key is acted on only when **present**, so clients that never
                    send it cannot flatten a composite by accident.
                  example: '{"servers":[{"scheme":"http","host":"192.168.1.10","port":"8080"},{"scheme":"http","host":"192.168.1.11","port":"8080"}],"sticky":{"enabled":true,"cookieName":"tm_sticky","secure":true,"httpOnly":true},"healthCheck":{"enabled":true,"path":"/health","interval":"10s","timeout":"3s"},"priority":10}'
                backendsJsonTcp:
                  type: string
                  description: "JSON object for a TCP service: `servers` (array of `{host, port}`) and `priority` (integer)."
                  example: '{"servers":[{"host":"192.168.1.10","port":"5432"}],"priority":5}'
                backendsJsonUdp:
                  type: string
                  description: "JSON object for a UDP service: `servers` (array of `{host, port}`)."
                  example: '{"servers":[{"host":"192.168.1.10","port":"53"}]}'
                protocol: { type: string, enum: [http, tcp, udp] }
                middlewares: { type: string, description: "Comma-separated middleware names" }
                scheme: { type: string, enum: [http, https], default: "http" }
                passHostHeader: { type: boolean, default: true }
                certResolver: { type: string, description: "ACME resolver name. Use `none` or `__none__` for external/custom certs (writes `tls: {}` with no resolver)." }
                tlsWildcardMain: { type: string, description: "Main domain for tls.domains (e.g. example.com). Use with DNS challenge resolvers for wildcard certs." }
                tlsWildcardSans: { type: string, description: "Newline-separated SANs for tls.domains (e.g. *.example.com)." }
                configFile: { type: string, description: "Target config file basename (multi-config only)" }
                isEdit: { type: boolean }
                originalId: { type: string }
      responses:
        "200":
          description: Success

  /delete/{route_id}:
    post:
      tags: [Routes & Middlewares]
      summary: Delete route
      parameters:
        - name: route_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                configFile: { type: string }
      responses:
        "200":
          description: Success

  /save-middleware:
    post:
      tags: [Routes & Middlewares]
      summary: Create or update middleware
      description: Create or update a middleware. Config is provided as raw YAML.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                middlewareName: { type: string }
                middlewareContent: { type: string, description: "YAML config body" }
                configFile: { type: string }
                isMwEdit: { type: boolean }
                originalMwId: { type: string }
      responses:
        "200":
          description: Success

  /delete-middleware/{name}:
    post:
      tags: [Routes & Middlewares]
      summary: Delete middleware
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                configFile: { type: string }
      responses:
        "200":
          description: Success

  # ─── Dashboard ────────────────────────────────────────────────────────────

  /api/dashboard/config:
    get:
      tags: [Dashboard]
      summary: Get dashboard config
      description: |
        Custom groups and per-route overrides for the dashboard.

        Each server keeps its own groups and overrides, so pass `server` to read an
        agent's configuration. Without it you get the Host's.
      parameters:
        - name: server
          in: query
          required: false
          schema: { type: string }
          description: Agent id. Omit for the Host.
      responses:
        "200":
          description: Dashboard config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Dashboard]
      summary: Save dashboard config
      description: |
        Replaces that server's section of `dashboard.yml`, leaving every other server
        untouched. Send the full `custom_groups` and `route_overrides` for the server -
        anything omitted is removed.

        The target server can be given either as the `server` query parameter or as a
        `server` key in the body.
      parameters:
        - name: server
          in: query
          required: false
          schema: { type: string }
          description: Agent id. Omit for the Host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server:
                  type: string
                  description: Agent id, as an alternative to the query parameter.
                custom_groups:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                route_overrides:
                  type: object
                  additionalProperties: { $ref: "#/components/schemas/RouteOverride" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/dashboard/icon/{slug}:
    get:
      tags: [Dashboard]
      summary: Get app icon
      description: |
        Serve a cached app icon by slug. On cache miss, fetches from the selfh.st CDN
        and stores the PNG on disk. Responses are served with `Cache-Control: max-age=86400`.

        Misses are cached too: a slug with no icon returns `404` immediately on later
        requests rather than hitting the CDN again. Prefer this endpoint over the CDN
        directly - a client that fetches from the CDN itself makes one request per route
        on every render and loses the negative cache.

        **Resolving a route's icon.** Icons are resolved client-side, in this order:

        1. `icon_type: url` - use `icon_url` as-is.
        2. `icon_type: slug` - use `icon_slug`.
        3. Route name equals `tm_route_name` - use Traefik Manager's own icon.
        4. Otherwise (`auto`, or no override) - derive the slug from the route name:
           strip a trailing `:port`; strip one trailing `-service`, `-svc`, `-router`,
           `-app`, `-container` or `-pod` (optional plural, `-` or `_` separated);
           lowercase; drop every character outside `a-z0-9-`.

        So `Jellyfin-Service` and `jellyfin` both resolve to `jellyfin`. Fall back to a
        monogram when the request returns `404`.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          description: Icon name - lowercase alphanumeric and hyphens (e.g. `plex`, `grafana`)
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No icon for this slug, or the slug was empty after sanitising.
            Negatively cached, so repeat requests do not reach the CDN.

  # ─── Settings ─────────────────────────────────────────────────────────────

  /api/settings:
    get:
      tags: [Settings]
      summary: Get settings
      description: Get current application settings. Password hash is never included.
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains: { type: array, items: { type: string } }
                  cert_resolver: { type: string }
                  traefik_api_url: { type: string }
                  traefik_api_user: { type: string }
                  traefik_api_password_set: { type: boolean, description: "true if a Traefik API password is saved" }
                  acme_json_path: { type: string }
                  access_log_path: { type: string }
                  static_config_path: { type: string }
                  auth_enabled: { type: boolean }
                  oidc_enabled: { type: boolean }
                  visible_tabs: { type: object }
                  default_theme: { type: string, enum: [dark, light, system] }
                  crowdsec_lapi_url: { type: string }
                  crowdsec_api_key_set: { type: boolean, description: "true if a CrowdSec API key is saved" }
                  crowdsec_alert_limit: { type: string, example: "500", description: "Alert row limit, 0 to 100000. Blank falls back to CROWDSEC_ALERT_LIMIT." }
                  crowdsec_enabled: { type: boolean, description: "true if both LAPI URL and API key are configured" }
    post:
      tags: [Settings]
      summary: Update settings
      description: |
        Update application settings. Leave password fields blank to keep existing values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domains: { type: array, items: { type: string } }
                cert_resolver: { type: string }
                traefik_api_url: { type: string }
                traefik_api_user: { type: string }
                traefik_api_password: { type: string, description: "Leave blank to keep existing password" }
                acme_json_path: { type: string }
                access_log_path: { type: string }
                static_config_path: { type: string }
                crowdsec_lapi_url: { type: string }
                crowdsec_api_key: { type: string, description: "Leave blank to keep existing key" }
                crowdsec_alert_limit: { type: string, description: "Alert row limit, 0 to 100000. Blank falls back to CROWDSEC_ALERT_LIMIT." }
      responses:
        "200":
          description: Success
        "400":
          description: Invalid input, for example an alert limit that is not a whole number or is outside 0 to 100000
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/settings/self-route:
    get:
      tags: [Settings]
      summary: Get self-route
      description: Get the current self-route configuration. If no domain is saved, TM scans config files for an existing route pointing to the TM service.
      responses:
        "200":
          description: Self-route config
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  service_url: { type: string }
    post:
      tags: [Settings]
      summary: Save self-route
      description: Save or remove the self-route. When domain is empty, the self-route file is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain: { type: string }
                service_url: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /api/settings/tabs:
    post:
      tags: [Settings]
      summary: Toggle UI tabs
      description: Show or hide optional provider tabs in the UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
              example:
                dashboard: true
                routemap: true
                docker: false
      responses:
        "200":
          description: Updated tab visibility
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  visible_tabs: { type: object }

  /api/settings/ui:
    get:
      tags: [Settings]
      summary: Get display preferences
      description: |
        Cosmetic preferences stored server-side rather than in the browser, so
        they follow the user across browsers, devices and private windows.
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ui_prefs: { $ref: "#/components/schemas/UiPrefs" }
    post:
      tags: [Settings]
      summary: Update display preferences
      description: |
        Updates one or more preferences. Keys not sent keep their current value.

        Only the documented keys are stored - anything else is dropped rather
        than written, since this endpoint writes into `manager.yml`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ui_prefs: { $ref: "#/components/schemas/UiPrefs" }
      responses:
        "200":
          description: The merged preferences after the update
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ui_prefs: { $ref: "#/components/schemas/UiPrefs" }
        "400":
          description: ui_prefs was not an object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/settings/theme:
    post:
      tags: [Settings]
      summary: Set default theme
      description: Set the default UI theme, stored as `default_theme` in `manager.yml`. Also saved by the theme toggle in the nav bar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [default_theme]
              properties:
                default_theme: { type: string, enum: [dark, light, system] }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  default_theme: { type: string }
        "400":
          description: Invalid theme

  /api/settings/geoip:
    post:
      tags: [Settings]
      summary: Save geolocation settings
      description: Enable/disable IP geolocation and optionally set a custom database path. Does not require the full settings payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                geoip_enabled: { type: boolean }
                geoip_db_path: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  status: { type: object }

  /api/geoip/status:
    get:
      tags: [Settings]
      summary: GeoIP status
      description: Whether IP geolocation is enabled and whether the local database is present.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  available: { type: boolean }
                  db_path: { type: string }
                  db_date: { type: [string, "null"], description: Database file date (YYYY-MM-DD) }

  /api/geoip/lookup:
    post:
      tags: [Settings]
      summary: Look up countries for IPs
      description: Resolve a batch of IP addresses to countries against the local database. Runs entirely on the server - IPs are never sent to a third party. Returns an empty result set if geolocation is disabled or the database is missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ips: { type: array, items: { type: string }, description: Up to 2000 IP addresses }
      responses:
        "200":
          description: Lookup results
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  available: { type: boolean }
                  results:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        country_code: { type: string, example: US }
                        country_name: { type: string, example: United States }

  /api/geoip/update:
    post:
      tags: [Settings]
      summary: Download / refresh GeoIP database
      description: Download the latest free DB-IP Lite country database (or your configured source) and reload it.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  db_month: { type: string, example: "2026-07" }
        "502":
          description: Download failed

  /api/settings/backup-retention:
    post:
      tags: [Settings]
      summary: Set backup retention
      description: How many timestamped backups to keep per config file. 0 keeps all backups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backup_keep_count: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Saved

  /api/settings/test-connection:
    post:
      tags: [Settings]
      summary: Test Traefik API connection
      description: Test connectivity to a Traefik API URL using optional credentials. Does not save any settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "http://traefik:8080" }
                user: { type: string, description: "Basic auth username" }
                password: { type: string, description: "Basic auth password" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string, example: "3.2.0" }
                  error: { type: string }

  # ─── TLS Options ──────────────────────────────────────────────────────────

  /api/tls-options:
    get:
      tags: [TLS Options]
      summary: List TLS option profiles
      responses:
        "200":
          description: Array of TLS option profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    configFile: { type: string }
                    minVersion: { type: string }
                    maxVersion: { type: string }
                    sniStrict: { type: boolean }
                    cipherSuites: { type: array, items: { type: string } }
                    curvePreferences: { type: array, items: { type: string } }
                    alpnProtocols: { type: array, items: { type: string } }
                    clientAuthType: { type: string }
                    clientAuthCAs: { type: array, items: { type: string } }
                    yaml: { type: string }
    post:
      tags: [TLS Options]
      summary: Create or update a TLS option profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                configFile: { type: string }
                minVersion: { type: string }
                maxVersion: { type: string }
                sniStrict: { type: boolean }
                cipherSuites: { type: array, items: { type: string } }
                curvePreferences: { type: array, items: { type: string } }
                alpnProtocols: { type: array, items: { type: string } }
                clientAuthType: { type: string }
                clientAuthCAs: { type: array, items: { type: string } }
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/tls-options/{name}:
    delete:
      tags: [TLS Options]
      summary: Delete a TLS option profile
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: configFile
          schema: { type: string }
      responses:
        "200":
          description: Profile deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ─── Backups ──────────────────────────────────────────────────────────────

  /api/backups:
    get:
      tags: [Backups]
      summary: List backups
      responses:
        "200":
          description: Backup file list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupFile" }

  /api/backup/create:
    post:
      tags: [Backups]
      summary: Create backup
      description: Create a manual backup of the current configuration.
      responses:
        "200":
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  name: { type: string, example: "backup_2026-03-24T22-05-00.yml" }

  /api/backup/static/create:
    post:
      tags: [Backups]
      summary: Create static config backup
      description: Create a manual backup of the static Traefik config (`traefik.yml`). Requires `STATIC_CONFIG_PATH` to be configured.
      responses:
        "200":
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  name: { type: string, example: "traefik.yml.20260601_120000.bak" }
        "400":
          description: Static config not configured or file not found

  /api/restore/{filename}:
    post:
      tags: [Backups]
      summary: Restore backup
      description: Restore configuration from a backup file. Rate-limited to 10/min.
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api/backup/delete/{filename}:
    post:
      tags: [Backups]
      summary: Delete backup
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── Git Backup ───────────────────────────────────────────────────────────

  /api/backup/git/status:
    get:
      tags: [Backups]
      summary: Git backup status
      description: Whether git backup is configured, and the last pushed commit. Pass `agent_id` to query a remote agent's Host-managed git backup.
      parameters:
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  configured: { type: boolean }
                  last_sha: { type: [string, "null"] }
                  last_push: { type: [string, "null"] }
                  branch: { type: string, description: Only present for agents }

  /api/backup/git/push:
    post:
      tags: [Backups]
      summary: Push git backup
      description: Commit and push the current configuration to the configured repository. Pass `agent_id` to push a remote agent's configuration to its branch.
      parameters:
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, description: Custom commit message for this push only }
      responses:
        "200":
          description: Pushed
        "400":
          description: Push failed

  /api/backup/git/test:
    post:
      tags: [Backups]
      summary: Test git connection
      description: Verify the repository URL and credentials with git ls-remote.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                repo_url: { type: string }
                username: { type: string }
                token: { type: string }
      responses:
        "200":
          description: Reachable
        "400":
          description: Unreachable or invalid URL

  /api/backup/git/commits:
    get:
      tags: [Backups]
      summary: List git commits
      description: Last 50 commits in the backup repository. Pass `agent_id` for a remote agent's history.
      parameters:
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Commit list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sha: { type: string }
                    sha_short: { type: string }
                    timestamp: { type: string }
                    message: { type: string }

  /api/backup/git/commit/{sha}/diff:
    get:
      tags: [Backups]
      summary: Get commit diff
      description: Per-file old and new contents for a commit. Pass `agent_id` for a remote agent's repository.
      parameters:
        - name: sha
          in: path
          required: true
          schema: { type: string }
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  stat: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        status: { type: string }
                        old: { type: string }
                        new: { type: string }

  /api/backup/git/restore/{sha}:
    post:
      tags: [Backups]
      summary: Restore from git commit
      description: Restore configuration files from a commit. Local backups are created first. With `agent_id`, the commit's dynamic config files are written back to the agent.
      parameters:
        - name: sha
          in: path
          required: true
          schema: { type: string }
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Restored

  /api/backup/git/repo:
    delete:
      tags: [Backups]
      summary: Reset git repository
      description: Delete the local clone; it is re-initialized on the next push. Pass `agent_id` to reset a remote agent's clone.
      parameters:
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Reset

  # ─── Notifications ────────────────────────────────────────────────────────

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: List all stored notifications, newest first.
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /api/notifications/delete:
    post:
      tags: [Notifications]
      summary: Delete notification
      description: Delete a single notification. Prefer id, which removes exactly that row. ts is still accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ts]
              properties:
                ts: { type: string, example: "2026-04-13 20:25:03" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /api/notifications/read:
    post:
      tags: [Notifications]
      summary: Set the shared read marker
      description: Marks notifications read up to an id, or all of them. Shared by the web bell and the mobile app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:  { type: integer, example: 412 }
                all: { type: boolean, example: true }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:         { type: boolean }
                  read_until: { type: integer, example: 412 }

  /api/notifications/state:
    get:
      tags: [Notifications]
      summary: Read marker and unread count
      description: Unread cannot be derived from the array length once the 200 entry cap is reached.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  read_until: { type: integer, example: 412 }
                  count:      { type: integer, example: 200 }
                  unread:     { type: integer, example: 4 }

  /api/notifications/clear:
    post:
      tags: [Notifications]
      summary: Clear all notifications
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  # ─── Static Config ────────────────────────────────────────────────────────

  /api/static/available:
    get:
      tags: [Static Config]
      summary: Check availability
      description: Check whether the static config editor is available (`STATIC_CONFIG_PATH` set and file exists).
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }

  /api/static/config:
    get:
      tags: [Static Config]
      summary: Read static config
      description: Read and parse the current static config file.
      responses:
        "200":
          description: Static config content
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw: { type: string }
                  parsed: { type: object }
                  path: { type: string }
    post:
      tags: [Static Config]
      summary: Write static config
      description: Validate and write an updated static config. A timestamped backup is created before writing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400":
          description: Invalid YAML
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /api/static/restart:
    post:
      tags: [Static Config]
      summary: Restart Traefik
      description: Trigger a Traefik restart using the configured `RESTART_METHOD`.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "500":
          description: Restart failed or not configured

  /api/static/status:
    get:
      tags: [Static Config]
      summary: Traefik up?
      description: Check whether Traefik is currently up. Used by the reconnect overlay after a restart.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  up: { type: boolean }

  /api/static/section:
    post:
      tags: [Static Config]
      summary: Update config section
      description: |
        Update a single named item within the static config, or set a single-block section.

        **Sections and actions**

        | `section` | Supported actions | `data` fields |
        |-----------|-------------------|---------------|
        | `entrypoints` | `add`, `edit`, `remove` | `address`, `redirect_to` |
        | `resolvers` | `add`, `edit`, `remove` | `email`, `storage`, `challenge_type`, `provider`, `http_entrypoint` |
        | `plugins` | `add`, `edit`, `remove` | `moduleName`, `version` |
        | `api` | `set` | `enabled`, `dashboard`, `insecure`, `debug` |
        | `log` | `set` | `level`, `accessLog`, `accessLogPath` |
        | `providers` | `set` | `docker`, `dockerEndpoint`, `dockerExposedByDefault`, `dockerWatch`, `file`, `fileDirectory`, `fileWatch` |
        | `providers` | `add`, `edit`, `remove` | `name` = provider type key, `yaml_config` = YAML body for that provider |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, section]
              properties:
                action: { type: string, enum: [add, edit, remove, set] }
                section: { type: string, enum: [entrypoints, resolvers, plugins, api, log, providers] }
                name: { type: string }
                old_name: { type: string }
                data: { type: object }
                current_raw: { type: string }
            examples:
              add_entrypoint:
                summary: Add entrypoint
                value:
                  action: add
                  section: entrypoints
                  name: websecure
                  data: { address: ":443" }
              set_api:
                summary: Configure API section
                value:
                  action: set
                  section: api
                  data: { enabled: true, dashboard: true, insecure: false }
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  raw: { type: string }
                  parsed: { type: object }

  /api/static/trusted-ips/preview:
    post:
      tags: [Static Config]
      summary: Preview trusted IPs merge
      description: |
        Compute the result of adding `forwardedHeaders.trustedIPs` to an entrypoint, without
        writing anything to disk. Backs the **Trusted IPs** helper in the Static Config editor.

        Trusting a proxy's IP makes Traefik believe its `X-Forwarded-For`, which then feeds the
        access logs, CrowdSec, `ipAllowList`, and the login rate-limiter. Only trust proxies you
        control.

        The merge is **additive with dedup**: existing entries are kept, and ranges already
        covered are skipped by normalized network (so `10.5.5.5/8` will not re-add `10.0.0.0/8`).
        Sibling keys under `forwardedHeaders`, other entrypoints, and YAML comments are all
        preserved. The endpoint is stateless and never saves; the returned `raw` is persisted by
        the client through `POST /api/static` (the normal backup + restart path), which is why it
        works identically on the Host and on a remote agent.

        Called in two modes:

        - **Inspect** (no `entrypoint`): returns the entrypoint list with their current
          `trustedIPs`, plus the built-in Cloudflare and private-range presets.
        - **Preview** (with `entrypoint`): additionally returns the merged `raw`, and the
          `existing` / `added` / `invalid` / `final` breakdown for the target entrypoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_raw: { type: string, description: "Static config YAML to operate on. Falls back to the file on disk when empty." }
                entrypoint: { type: string, description: "Target entrypoint. Omit for inspect mode." }
                cloudflare: { type: boolean, description: "Include the built-in Cloudflare edge ranges." }
                private: { type: boolean, description: "Include the private-range preset (10/8, 172.16/12, 192.168/16, fc00::/7)." }
                custom_cidrs:
                  description: "Extra CIDRs or IPs, as an array or a comma/whitespace-separated string. Invalid entries are returned in `invalid` and skipped."
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
            examples:
              inspect:
                summary: Inspect mode
                value:
                  current_raw: "entryPoints:\n  websecure:\n    address: ':443'\n"
              preview:
                summary: Preview a Cloudflare + custom merge
                value:
                  current_raw: "entryPoints:\n  websecure:\n    address: ':443'\n"
                  entrypoint: websecure
                  cloudflare: true
                  custom_cidrs: "203.0.113.10, 198.51.100.0/24"
      responses:
        "200":
          description: Inspect summary, or full preview when an entrypoint was given
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  entrypoints:
                    type: array
                    description: "Every entrypoint in the static config."
                    items:
                      type: object
                      properties:
                        name: { type: string, example: "websecure" }
                        address: { type: string, example: ":443" }
                        trusted_ips:
                          type: array
                          items: { type: string }
                          description: "The entrypoint's current forwardedHeaders.trustedIPs."
                  cloudflare_captured: { type: string, description: "Capture date of the bundled Cloudflare ranges.", example: "2026-07-23" }
                  cloudflare_ranges: { type: array, items: { type: string } }
                  private_ranges: { type: array, items: { type: string } }
                  entrypoint: { type: string, description: "Preview mode only: the target entrypoint." }
                  existing:
                    type: array
                    items: { type: string }
                    description: "Preview mode only: trustedIPs before the merge."
                  added:
                    type: array
                    items: { type: string }
                    description: "Preview mode only: ranges the merge would add (excludes duplicates)."
                  invalid:
                    type: array
                    items: { type: string }
                    description: "Preview mode only: custom entries that failed CIDR/IP validation and were skipped."
                  final:
                    type: array
                    items: { type: string }
                    description: "Preview mode only: the resulting trustedIPs (existing + added)."
                  raw: { type: string, description: "Preview mode only: the full merged static config YAML, to save via POST /api/static." }
                  parsed: { type: object, description: "Preview mode only: the merged config parsed back to JSON." }
        "400":
          description: Named entrypoint not found, or the static config is not a mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No static config on disk and no current_raw supplied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ─── Agents ───────────────────────────────────────────────────────────────

  /api/agents:
    get:
      tags: [Agents]
      summary: List agents
      description: Every registered remote server. Secrets are redacted to `***`.
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
    post:
      tags: [Agents]
      summary: Register an agent
      description: |
        Register a remote server. An API key is generated server-side and returned
        **once** as `api_key_raw` - it is redacted on every later read, so store it
        when you receive it. Use it as the agent's `TMA_API_KEY`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, example: "vps-frankfurt" }
                url: { type: string, example: "https://agent.example.com:8090" }
                install_method: { type: string, enum: [cli, manual], default: manual }
                traefik_api_url: { type: string }
                config_path: { type: string }
                domains: { type: array, items: { type: string } }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  agent: { $ref: "#/components/schemas/Agent" }
                  api_key_raw: { type: string, description: "Shown once. Not retrievable later." }
        "400":
          description: name and url are required, or the URL has no http/https scheme or no host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/agents/{agent_id}:
    put:
      tags: [Agents]
      summary: Update an agent
      description: |
        Update any subset of the agent's fields. Omitted fields keep their value.

        When `git_host_backup` is enabled the agent pushes to the **Host's**
        repository, and `git_host_branch` must be unique: a branch already used by
        the Host or by another agent is rejected with 400, since two servers sharing
        a branch would overwrite each other's configs.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Agent" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  agent: { $ref: "#/components/schemas/Agent" }
        "400":
          description: Empty name, a URL with no http/https scheme or no host, or a branch already in use by the Host or another agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Agent not found
    delete:
      tags: [Agents]
      summary: Remove an agent
      description: |
        Removes the registration from this instance, along with the Host's per-agent git
        clone and that agent's disabled-route and managed-middleware entries in
        `manager.yml`. Idempotent: an unknown id also returns 200. The agent itself keeps
        running; stop it separately.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /api/agents/{agent_id}/health:
    get:
      tags: [Agents]
      summary: Agent health check
      description: |
        Calls the agent's unauthenticated `/health` and reports round-trip latency.
        Always returns 200 for a known agent - an unreachable agent is reported as
        `ok: false` with `latency_ms: -1`, so a failing server does not read as a
        failing request.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Health result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  latency_ms: { type: integer, description: "Round trip in ms, or -1 when unreachable.", example: 34 }
                  version: { type: string, description: "Agent version, when it answered." }
                  status: { type: integer, description: "HTTP status from the agent." }
                  error: { type: string, description: "Present only on failure." }
        "404":
          description: Agent not found

  /api/agents/{agent_id}/rotate-key:
    post:
      tags: [Agents]
      summary: Rotate an agent's API key
      description: |
        Generates a new key and stores it. The new key is returned **once** as
        `api_key_raw`.

        The old key stops working immediately, so the agent cannot be reached until
        its `TMA_API_KEY` is updated and it is restarted.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  agent: { $ref: "#/components/schemas/Agent" }
                  api_key_raw: { type: string, description: "Shown once. Not retrievable later." }
        "404":
          description: Agent not found

  /api/agents/{agent_id}/routes:
    get:
      tags: [Agents]
      summary: Routes on an agent
      description: |
        The same shape as `GET /api/routes`, built from that agent's config files
        and enriched from its Traefik API. Route objects are identical to the Host's,
        so a client can render either without special-casing.

        If the agent's Traefik API cannot be reached, routes from its config files
        are still returned and the failure is reported in `configErrors`.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Routes and middlewares
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items: { $ref: "#/components/schemas/Route" }
                  middlewares:
                    type: array
                    items: { $ref: "#/components/schemas/Middleware" }
                  configErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        file: { type: string }
                        error: { type: string }
        "404":
          description: Agent not found

  /api/agents/{agent_id}/cert-resolvers:
    get:
      tags: [Agents]
      summary: Cert resolvers available on an agent
      description: |
        Resolver names offered in the route form for this server. Collected from the
        resolvers already used by that server's routers (via its Traefik API), merged
        with anything found in its static config when it is mounted, plus the agent's
        optional `cert_resolver` field.

        This is why an agent does not need its static config mounted to offer
        resolvers.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolver names
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolvers:
                    type: array
                    items: { type: string }
                    example: ["letsencrypt", "cloudflare"]
        "404":
          description: Agent not found

  /api/agents/proxy/{agent_id}/{path}:
    get:
      tags: [Agents]
      summary: Proxy a request to an agent
      description: |
        Forwards the request to `\/api\/{path}` on that agent, adding its stored API
        key. Lets a browser or the mobile app reach an agent it has no credentials
        for, without exposing the key.

        The agent's status code and body are returned as-is. Method, query string and
        JSON body are forwarded; GET, POST, PUT, DELETE and PATCH are accepted.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: path
          required: true
          description: "Path on the agent below /api/, e.g. `traefik/routers`."
          schema: { type: string }
          example: traefik/routers
      responses:
        "200":
          description: Whatever the agent returned
        "404":
          description: Agent not found
        "502":
          description: The agent could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ─── CrowdSec ─────────────────────────────────────────────────────────────

  /api/crowdsec/decisions:
    get:
      tags: [CrowdSec]
      summary: List active decisions
      description: Returns all active CrowdSec decisions (bans, captchas, bypasses), paginated from the LAPI. Expired decisions are filtered out. Returns an empty list if CrowdSec is not configured.
      responses:
        "200":
          description: Decision list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    value: { type: string, example: "1.2.3.4" }
                    type: { type: string, example: "ban" }
                    duration: { type: string, example: "3h59m" }
                    until: { type: string, format: date-time }
                    scenario: { type: string, example: "crowdsecurity/http-bf" }
                    origin: { type: string, example: "CAPI" }
    post:
      tags: [CrowdSec]
      summary: Add a manual decision
      description: Creates a manual ban, captcha, or bypass decision via the CrowdSec LAPI. Requires the bouncer key to have write permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, type, duration]
              properties:
                value:
                  type: string
                  description: IP address or CIDR range
                  example: "1.2.3.4"
                type:
                  type: string
                  enum: [ban, captcha, bypass]
                  example: "ban"
                duration:
                  type: string
                  description: Decision duration (e.g. 24h, 7d)
                  example: "24h"
                reason:
                  type: string
                  description: Optional reason/scenario label
                  example: "manual ban from Traefik Manager"
      responses:
        "200":
          description: Decision created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid input
        "502":
          description: LAPI unreachable or returned an error

  /api/crowdsec/alerts:
    get:
      tags: [CrowdSec]
      summary: List recent alerts
      description: |
        Returns the most recent CrowdSec alerts. The row limit is 500 by default and
        is set by the `crowdsec_alert_limit` setting or the `CROWDSEC_ALERT_LIMIT`
        env var, 0 to 100000, where 0 reads every alert.
      responses:
        "200":
          description: Alert list
          headers:
            X-CS-Alert-Limit:
              description: The row limit applied to this response.
              schema: { type: integer, example: 500 }
            X-CS-Alert-Capped:
              description: "1 when the response hit the limit, 0 otherwise."
              schema: { type: string, enum: ["0", "1"] }
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    startAt: { type: string, format: date-time }
                    source:
                      type: object
                      properties:
                        ip: { type: string, example: "1.2.3.4" }
                    scenario: { type: string, example: "crowdsecurity/http-bf" }
                    decisions:
                      type: array
                      items:
                        type: object
                        properties:
                          type: { type: string }
                          duration: { type: string }

  /api/crowdsec/decisions/{decision_id}:
    delete:
      tags: [CrowdSec]
      summary: Delete a decision (unban)
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }

  # ─── Utility ──────────────────────────────────────────────────────────────

  /api/manager/version:
    get:
      tags: [Utility]
      summary: TM version
      description: Get the deployed Traefik Manager version.
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: "1.0.0-beta3" }
                  repo: { type: string, example: "https://github.com/chr0nzz/traefik-manager" }

  /api/routes/all:
    get:
      tags: [Routes & Middlewares]
      summary: List routes including external and internal
      description: |
        Same shape as `GET /api/routes`, but nothing is filtered out: routes discovered from
        other Traefik providers (Docker, Kubernetes, and the rest) are enriched from the live
        Traefik API, and Traefik's own `@internal` routers are included.

        Use this when you want a complete picture of everything Traefik is serving. Use
        `/api/routes` when you only want the routes this instance manages in its dynamic
        config files. Unlike `/api/routes`, this endpoint does not return `configErrors`.
      responses:
        "200":
          description: All routes and middlewares
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items: { $ref: "#/components/schemas/Route" }
                  middlewares:
                    type: array
                    items: { $ref: "#/components/schemas/Middleware" }

  /api/diagnostics/client-ip:
    get:
      tags: [Utility]
      summary: Client IP diagnostic
      description: |
        Read-only view of what this instance sees for the calling request: the client IP
        trusted after `ProxyFix` (the one used for the login rate-limiter, the audit log,
        `ipAllowList`, and CrowdSec), the raw socket peer, the configured trusted proxy hop
        count (`PROXY_FIX_HOPS`), and the forwarding headers exactly as received.

        Each IP is classified so a private, loopback, or CGNAT address showing up where you
        expect public clients is easy to spot - that usually means the upstream `trustedIPs`
        or hop count is wrong and real client IPs are being lost.
      responses:
        "200":
          description: Diagnostic result
          content:
            application/json:
              schema:
                type: object
                properties:
                  effective_ip: { type: string, description: "The trusted client IP after ProxyFix.", example: "203.0.113.7" }
                  effective_class: { type: string, enum: [public, private, cgnat, loopback, link-local, unknown] }
                  socket_peer: { type: string, description: "Raw TCP peer before ProxyFix.", example: "172.18.0.4" }
                  socket_peer_class: { type: string }
                  proxy_hops: { type: integer, description: "Value of PROXY_FIX_HOPS.", example: 1 }
                  forwarded_for_chain:
                    type: array
                    items: { type: string }
                    description: "X-Forwarded-For split left to right, as received."
                    example: ["203.0.113.7", "172.18.0.3"]
                  headers:
                    type: object
                    description: "Forwarding headers as received. Missing headers are empty strings."
                    properties:
                      X-Forwarded-For: { type: string }
                      X-Real-IP: { type: string }
                      CF-Connecting-IP: { type: string }
                      X-Forwarded-Proto: { type: string }
                      X-Forwarded-Host: { type: string }
                  classes:
                    type: object
                    additionalProperties: { type: string }
                    description: "Classification for every IP seen, keyed by address."
                    example: { "203.0.113.7": "public", "172.18.0.4": "private" }

  /api/manager/router-names:
    get:
      tags: [Utility]
      summary: Router names
      description: Get all router names across every protocol. Useful for autocomplete.
      responses:
        "200":
          description: Router name list
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: ["my-app@file", "api@file"]

  /api/setup/test-connection:
    post:
      tags: [Utility]
      summary: Test Traefik connection
      description: Test connectivity to a Traefik API URL. No authentication required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "http://traefik:8080" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string, example: "3.2.0" }

  /api/services:
    post:
      tags: [Services]
      summary: Create or update a composite service
      description: >
        Creates a `weighted`, `mirroring` or `failover` service and the child services for any
        IP:Port backends. Pass `originalName` to rename an existing managed service. Refuses to
        overwrite a service Traefik Manager does not manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, children]
              properties:
                name:         { type: string, example: api-pool }
                type:         { type: string, enum: [weighted, mirroring, failover] }
                originalName: { type: string, description: set when renaming }
                configFile:   { type: string }
                children:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:    { type: string, enum: [manual, service] }
                      address: { type: string, example: "10.0.0.10:80" }
                      name:    { type: string, description: for kind service }
                      scheme:  { type: string, enum: [http, https] }
                      weight:  { type: integer }
                      percent: { type: integer, description: mirroring only }
      responses:
        "200": { description: Saved }
        "400": { description: Bad name, type or backends }
        "403": { description: Not managed by Traefik Manager }
        "409": { description: A service of that name already exists }

  /api/services/{name}/ownership:
    post:
      tags: [Services]
      summary: Take over or release management of a composite service
      description: >
        Records or removes a ledger entry only. No YAML is written, so adopting a hand-written
        service leaves the file byte for byte unchanged. Only `weighted`, `mirroring`, `failover`
        and `highestRandomWeight` services can be managed.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adopt: { type: boolean, description: true to manage, false to release }
      responses:
        "200":
          description: Management changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean }
                  owned: { type: boolean }
        "400": { description: Not a composite service }
        "404": { description: No such service }

  /api/services/{name}:
    delete:
      tags: [Services]
      summary: Delete a managed composite service
      description: >
        Removes the service and the child services it owns. Refuses while a router still points at
        it or another service still lists it as a backend.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }
        "403": { description: Not managed by Traefik Manager }
        "404": { description: No such service }
        "409": { description: Still in use }

  /api/storage/status:
    get:
      tags: [Utility]
      summary: Whether the directories Traefik Manager writes to are writable
      description: >
        Probes the configuration, backup and dynamic config directories by writing and removing a
        temporary file. An empty `problems` array means everything is writable. The result is cached
        for 30 seconds.
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string, example: Configuration }
                        path:  { type: string, example: /app/config }
                        error: { type: string, example: read-only file system }

  /api/health:
    get:
      tags: [Utility]
      summary: Liveness probe
      description: The only `/api/` endpoint that needs no authentication. Suitable as a container healthcheck.
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }

  /api/traefik/runtime:
    get:
      tags: [Utility]
      summary: How Traefik Manager expects to reach Traefik
      description: Used by the Static Config tab to tailor its guidance after adding an entrypoint.
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "200":
          description: Runtime information
          content:
            application/json:
              schema:
                type: object
                properties:
                  method: { type: string, example: proxy }
                  runtime: { type: string, enum: [docker, native, unknown] }
                  container: { type: [string, "null"], example: traefik }

  /api/tools/htpasswd:
    post:
      tags: [Utility]
      summary: Generate an APR1 hash for basicauth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: username or password missing }
        "200":
          description: Generated hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  hash: { type: string, example: "admin:$apr1$..." }

  /api/tools/digestauth:
    post:
      tags: [Utility]
      summary: Generate an MD5 hash for digestauth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, realm, password]
              properties:
                username: { type: string }
                realm: { type: string, example: traefik }
                password: { type: string, format: password }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: "username, realm or password missing" }
        "200":
          description: Generated hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  hash: { type: string }

  /api/settings/webhook-test:
    post:
      tags: [Notifications]
      summary: Send a test webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                webhook_type: { type: string, example: discord }
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: "Invalid URL, or the target is blocked by the SSRF guard" }
        "200": { description: Delivery result }

  /api/auth/external-ack:
    post:
      tags: [Authentication]
      summary: Acknowledge that an external provider protects this instance
      description: |
        Hides the "no authentication" banner when a forward-auth provider already
        requires a login. Changes only what the UI reports, never what is enforced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_external_ack: { type: boolean }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: "A password or OIDC is active, so there is nothing to acknowledge" }
        "200": { description: Saved }

  /api/notifications/add:
    post:
      tags: [Notifications]
      summary: Add a notification and fire the configured webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                type: { type: string, enum: [info, success, warning, error] }
                message: { type: string }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: message required }
        "200": { description: Added }

  /api/notifications/log:
    post:
      tags: [Notifications]
      summary: Record a UI toast without firing a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                type: { type: string, enum: [info, success, warning, error] }
                message: { type: string, maxLength: 300 }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: Empty message }
        "200":
          description: Recorded. stored is false when the type is filtered out by settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  stored: { type: boolean }

  /api/notifications/update:
    post:
      tags: [Notifications]
      summary: Record an update-available notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, example: "1.12.0" }
                product: { type: string, enum: [manager, traefik] }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "200": { description: Recorded }

  /api/notifications/channels:
    get:
      tags: [Notifications]
      summary: List notification channels
      description: Every configured delivery target. Secrets are redacted to `***`.
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "200":
          description: Channel list
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationChannel" }
    post:
      tags: [Notifications]
      summary: Create a notification channel
      description: |
        `kind` is required and must be one of the supported kinds; an unknown kind is
        rejected rather than defaulted. The `id` is generated server-side. Omitted
        fields take their defaults: enabled, every category, `min_severity` `info`,
        `digest` `immediate`, no quiet hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NotificationChannel"
                - type: object
                  required: [kind]
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400":
          description: Unknown kind, category, min_severity or digest, or a malformed quiet_hours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  channel: { $ref: "#/components/schemas/NotificationChannel" }

  /api/notifications/channels/{channel_id}:
    put:
      tags: [Notifications]
      summary: Update a notification channel
      description: |
        Update any subset of the channel's fields. Omitted fields keep their value.
        Send a secret as `***` to keep the stored one, or any other string to replace it.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannel" }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400":
          description: Unknown kind, category, min_severity or digest, or a malformed quiet_hours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Channel not found }
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  channel: { $ref: "#/components/schemas/NotificationChannel" }
    delete:
      tags: [Notifications]
      summary: Delete a notification channel
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { description: Channel not found }
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /api/notifications/channels/{channel_id}/test:
    post:
      tags: [Notifications]
      summary: Send a test notification to one channel
      description: |
        Delivers immediately, ignoring the channel's category, severity, digest and
        quiet-hour filters. A channel missing a required field for its kind is rejected
        with 400 naming the field, without attempting delivery.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400":
          description: The channel is missing a field its kind requires
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Channel not found }
        "200":
          description: Delivery attempted. `ok` is false when the provider rejected it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string, description: "Provider note on success, e.g. the Pushover monthly quota." }
                  error: { type: string }

  /api/static/backup/create:
    post:
      tags: [Backups]
      summary: Back up traefik.yml on demand
      description: '`POST /api/backup/static/create` is an alias for this endpoint.'
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: "STATIC_CONFIG_PATH not set, or the file is missing" }
        "200":
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  name: { type: string }

  /api/plugins/install:
    post:
      tags: [Static Config]
      summary: Install a Traefik plugin from pasted YAML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [static_yaml]
              properties:
                static_yaml: { type: string, description: Must contain an experimental.plugins block }
                middleware_yaml: { type: string, description: Optionally create the middleware that uses it }
                config_file: { type: string, description: Which dynamic config file the middleware goes to }
                server: { type: string, description: "Agent id, to install on an agent" }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: "Invalid YAML, or no plugins block found" }
        "404": { description: Agent not found }
        "200": { description: Installed }

  /api/routes/{route_id}/raw:
    get:
      tags: [Routes & Middlewares]
      summary: The YAML for one route and its service
      description: Go template expressions are preserved rather than expanded.
      parameters:
        - { name: route_id, in: path, required: true, schema: { type: string }, description: "Router name, or file.yml::router on a multi-file install" }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { description: No config file contains that router }
        "200":
          description: Route YAML
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw: { type: string }
                  configFile: { type: string }
                  proto: { type: string, enum: [http, tcp, udp] }
    post:
      tags: [Routes & Middlewares]
      summary: Replace one route's YAML
      description: A backup is taken first. Go templates in the content are preserved.
      parameters:
        - { name: route_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: Empty content or invalid YAML }
        "404": { description: Route not found }
        "200": { description: Saved }

  /api/mw/templates:
    get:
      tags: [Routes & Middlewares]
      summary: List middleware templates
      description: Templates are stored on the Host and are not per-server.
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        yaml: { type: string }
    post:
      tags: [Routes & Middlewares]
      summary: Create a middleware template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                yaml: { type: string }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: name is required }
        "200": { description: "Created, including the generated id" }

  /api/mw/templates/{template_id}:
    put:
      tags: [Routes & Middlewares]
      summary: Update a middleware template
      description: name and yaml are both optional; only what you send is changed.
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                yaml: { type: string }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { description: Template not found }
        "200": { description: Updated }
    delete:
      tags: [Routes & Middlewares]
      summary: Delete a middleware template
      description: Succeeds even if the id does not exist.
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: string } }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "200": { description: Deleted }

  /api/ping:
    get:
      tags: [Utility]
      summary: Ping a route's domain and return latency
      parameters:
        - { name: url, in: query, required: true, schema: { type: string } }
        - { name: fallback, in: query, schema: { type: string }, description: Tried if the first attempt fails }
      responses:
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { description: "Invalid URL, or the target is blocked by the SSRF guard" }
        "200":
          description: Result. A URL pointing at Traefik Manager itself short-circuits with self=true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  latency_ms: { type: [integer, "null"] }
                  status_code: { type: integer }
                  self: { type: boolean }
