<div id="tab-zookeeper" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="text" id="zookeeperSearch" oninput="filterZookeeper()" placeholder="{{ _('Search ZooKeeper routes…') }}" class="input-field pl-9">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="filterZookeeper('all')"  id="zk-all"  class="proto-btn active-http text-xs px-3 py-1.5">{{ pgettext('button', 'All') }}</button>
            <button onclick="filterZookeeper('http')" id="zk-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="filterZookeeper('tcp')"  id="zk-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="filterZookeeper('udp')"  id="zk-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="refreshZookeeperTab()" class="proto-btn text-xs px-3 py-1.5" title="{{ pgettext('tooltip', 'Refresh') }}"><i class="ph-bold ph-arrows-clockwise"></i></button>
        </div>
    </div>
    <div id="zookeeperVerdict" class="sig-root mb-4" data-note="{{ _('These routes are stored in ZooKeeper and are read-only here. Edit them directly in your ZooKeeper instance.') }}"></div>
    <div id="zookeeperContent">
        <div class="text-center py-16" style="color:var(--muted)">
            <i class="ph-light ph-spinner-gap text-4xl block mb-3 animate-spin opacity-40"></i>
            <p>{{ _('Loading ZooKeeper routes…') }}</p>
        </div>
    </div>
    <div id="zookeeperMiddlewares"></div>
</div>

<script src="{{ base_path }}/static/js/tab-zookeeper.js?v={{ asset_version }}"></script>
