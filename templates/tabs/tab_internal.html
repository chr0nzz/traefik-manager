<div id="tab-internal" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="text" id="internalSearch" oninput="filterInternal()" placeholder="Search internal routes..." class="input-field pl-9">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="filterInternal('all')"  id="int-all"  class="proto-btn active-http text-xs px-3 py-1.5">All</button>
            <button onclick="filterInternal('http')" id="int-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="filterInternal('tcp')"  id="int-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="filterInternal('udp')"  id="int-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="refreshInternalTab()" class="proto-btn text-xs px-3 py-1.5" title="Refresh"><i class="ph-bold ph-arrows-clockwise"></i></button>
        </div>
    </div>
    <div id="internalVerdict" class="sig-root mb-4" data-note="Traefik creates these itself. They are read-only here and are turned on or off in your static config."></div>
    <div id="internalContent">
        <div class="text-center py-16" style="color:var(--muted)">
            <i class="ph-light ph-spinner-gap text-4xl block mb-3 animate-spin opacity-40"></i>
            <p>Loading internal routes...</p>
        </div>
    </div>
    <div id="internalMiddlewares"></div>
</div>

<script src="{{ base_path }}/static/js/tab-internal.js?v={{ asset_version }}"></script>
