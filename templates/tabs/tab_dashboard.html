<div id="tab-dashboard" class="tab-content">

    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="search" id="dashSearch" oninput="dashApplyFilter()" placeholder="Search routes..." class="input-field pl-9" autocomplete="off" name="dash-search-nofill">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="dashFilterProto('all')"  id="dashf-all"  class="proto-btn active-http text-xs px-3 py-1.5">All</button>
            <button onclick="dashFilterProto('http')" id="dashf-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="dashFilterProto('tcp')"  id="dashf-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="dashFilterProto('udp')"  id="dashf-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div id="dashProviderFilters" class="hidden flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)"></div>
        <button onclick="rmOpenGroupsModal()" class="btn-icon" title="Configure route groups" style="width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);flex-shrink:0">
            <i class="ph-bold ph-tag" style="font-size:13px"></i>
        </button>
    </div>

    <div id="dashLoading" class="text-center py-20 hidden" style="color:var(--muted)">
        <i class="ph-light ph-squares-four text-6xl block mb-4 opacity-30" style="animation:pulse 1.5s ease-in-out infinite"></i>
        <p class="text-sm">Loading dashboard...</p>
    </div>
    <div id="dashEmpty" class="text-center py-20 hidden" style="color:var(--muted)">
        <i class="ph-light ph-squares-four text-6xl block mb-4 opacity-30"></i>
        <p class="text-base font-medium">No routes found</p>
    </div>

    <div id="dashPodsContainer" class="hidden">
        <div id="dashPodsGrid" class="rm-pods-grid"></div>
    </div>

</div>

<div id="rmGroupsModal" class="modal-overlay" style="display:none" onclick="_onBackdropClick(event,rmCloseGroupsModal)">
    <div class="modal-box modal-box-rm-groups">
        <div class="flex items-center justify-between px-5 py-4" style="border-bottom:1px solid var(--border);flex-shrink:0">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-tag" style="color:var(--blue);font-size:18px"></i>
                <h3 class="font-bold text-sm" style="color:var(--text)">Route Groups</h3>
            </div>
            <button type="button" onclick="rmCloseGroupsModal()" class="btn-icon"><i class="ph-bold ph-x text-sm"></i></button>
        </div>
        <div style="padding:16px 20px 20px;overflow-y:auto">
            <div class="text-xs mb-4" style="color:var(--muted)">Create custom groups and assign routes to them using the edit button on each route card.</div>
            <div id="rmGroupsList" style="margin-bottom:16px"></div>
            <div style="border-top:1px solid var(--border);padding-top:14px">
                <div class="flex gap-2">
                    <input type="text" id="rmNewGroupName" placeholder="New group name..." class="input-field" style="flex:1" onkeydown="if(event.key==='Enter')rmAddCustomGroup()">
                    <button onclick="rmAddCustomGroup()" class="nav-btn text-xs" style="height:36px;padding:0 14px;flex-shrink:0">
                        <i class="ph-bold ph-plus"></i> Add
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="rmEditModal" class="modal-overlay" style="display:none" onclick="_onBackdropClick(event,rmCloseEditModal)">
    <div class="modal-box modal-box-rm-edit">
        <div class="flex items-center justify-between px-5 py-4" style="border-bottom:1px solid var(--border);flex-shrink:0">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-pencil-simple" style="color:var(--blue);font-size:18px"></i>
                <h3 class="font-bold text-sm" style="color:var(--text)" id="rmEditModalTitle">Edit Route</h3>
            </div>
            <button type="button" onclick="rmCloseEditModal()" class="btn-icon"><i class="ph-bold ph-x text-sm"></i></button>
        </div>
        <div style="padding:18px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px">
            <div>
                <div class="text-xs font-semibold mb-1.5" style="color:var(--muted)">DISPLAY NAME</div>
                <input type="text" id="rmEditDisplayName" class="input-field" placeholder="Leave blank to use route name">
            </div>
            <div>
                <div class="text-xs font-semibold mb-1.5" style="color:var(--muted)">ICON</div>
                <div class="flex gap-1 mb-2 p-1 rounded-lg" style="background:var(--input-bg);border:1px solid var(--border);width:fit-content">
                    <button id="rmEditIconBtnAuto" onclick="rmEditSetIconType('auto')"  class="rm-view-btn active text-xs">Auto</button>
                    <button id="rmEditIconBtnSlug" onclick="rmEditSetIconType('slug')"  class="rm-view-btn text-xs">selfh.st slug</button>
                    <button id="rmEditIconBtnUrl"  onclick="rmEditSetIconType('url')"   class="rm-view-btn text-xs">Custom URL</button>
                </div>
                <div id="rmEditIconSlugRow" style="display:none">
                    <input type="text" id="rmEditIconSlug" class="input-field" placeholder="e.g. plex" oninput="rmEditPreviewIcon()">
                </div>
                <div id="rmEditIconUrlRow" style="display:none">
                    <input type="text" id="rmEditIconUrl" class="input-field" placeholder="https://example.com/icon.png" oninput="rmEditPreviewIcon()">
                </div>
                <div class="flex items-center gap-3 mt-2">
                    <img id="rmEditIconPreview" style="width:32px;height:32px;border-radius:6px;object-fit:contain;background:var(--btn-secondary-bg);border:1px solid var(--border)" alt="">
                    <span id="rmEditIconPreviewLabel" class="text-xs" style="color:var(--muted)"></span>
                </div>
            </div>
            <div>
                <div class="text-xs font-semibold mb-1.5" style="color:var(--muted)">GROUP</div>
                <select id="rmEditGroup" class="input-field"></select>
            </div>
            <div class="flex justify-end gap-2" style="padding-top:4px;border-top:1px solid var(--border)">
                <button onclick="rmCloseEditModal()" class="nav-btn text-xs" style="height:32px;padding:0 14px;background:transparent">Cancel</button>
                <button onclick="rmSaveRouteEdit()" class="nav-btn text-xs" style="height:32px;padding:0 14px">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/dashboard-tab.js?v={{ asset_version }}"></script>
