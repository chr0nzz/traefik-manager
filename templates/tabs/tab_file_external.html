<div id="tab-file_external" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="text" id="fileExternalSearch" oninput="filterFileExternal()" placeholder="{{ _('Search file provider routes...') }}" class="input-field pl-9">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="filterFileExternal('all')"  id="fe-all"  class="proto-btn active-http text-xs px-3 py-1.5">{{ pgettext('button', 'All') }}</button>
            <button onclick="filterFileExternal('http')" id="fe-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="filterFileExternal('tcp')"  id="fe-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="filterFileExternal('udp')"  id="fe-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="refreshFileExternalTab()" class="proto-btn text-xs px-3 py-1.5" title="{{ pgettext('tooltip', 'Refresh') }}"><i class="ph-bold ph-arrows-clockwise"></i></button>
        </div>
    </div>
    <div id="fileExternalVerdict" class="sig-root mb-4" data-note="{{ _('These routes come from external file provider configurations and are read-only here. Routes managed by traefik-manager are shown in the Routes tab instead.') }}"></div>
    <div id="fileExternalContent">
        <div class="text-center py-16" style="color:var(--muted)">
            <i class="ph-light ph-spinner-gap text-4xl block mb-3 animate-spin opacity-40"></i>
            <p>{{ _('Loading file provider routes...') }}</p>
        </div>
    </div>
    <div id="fileExternalMiddlewares"></div>
</div>

<script src="{{ base_path }}/static/js/tab-file_external.js?v={{ asset_version }}"></script>
