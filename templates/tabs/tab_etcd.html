<div id="tab-etcd" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="text" id="etcdSearch" oninput="filterEtcd()" placeholder="{{ _('Search etcd routes...') }}" class="input-field pl-9">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="filterEtcd('all')"  id="et-all"  class="proto-btn active-http text-xs px-3 py-1.5">{{ pgettext('button', 'All') }}</button>
            <button onclick="filterEtcd('http')" id="et-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="filterEtcd('tcp')"  id="et-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="filterEtcd('udp')"  id="et-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="refreshEtcdTab()" class="proto-btn text-xs px-3 py-1.5" title="{{ pgettext('tooltip', 'Refresh') }}"><i class="ph-bold ph-arrows-clockwise"></i></button>
        </div>
    </div>
    <div id="etcdVerdict" class="sig-root mb-4" data-note="{{ _('These routes are stored in etcd and are read-only here. Edit them directly in your etcd KV store.') }}"></div>
    <div id="etcdContent">
        <div class="text-center py-16" style="color:var(--muted)">
            <i class="ph-light ph-spinner-gap text-4xl block mb-3 animate-spin opacity-40"></i>
            <p>{{ _('Loading etcd routes...') }}</p>
        </div>
    </div>
    <div id="etcdMiddlewares"></div>
</div>

<script src="{{ base_path }}/static/js/tab-etcd.js?v={{ asset_version }}"></script>
