<div id="tab-nomad" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="text" id="nomadSearch" oninput="filterNomad()" placeholder="{{ _('Search Nomad routes...') }}" class="input-field pl-9">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="filterNomad('all')"  id="nm-all"  class="proto-btn active-http text-xs px-3 py-1.5">{{ pgettext('button', 'All') }}</button>
            <button onclick="filterNomad('http')" id="nm-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="filterNomad('tcp')"  id="nm-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="filterNomad('udp')"  id="nm-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="refreshNomadTab()" class="proto-btn text-xs px-3 py-1.5" title="{{ pgettext('tooltip', 'Refresh') }}"><i class="ph-bold ph-arrows-clockwise"></i></button>
        </div>
    </div>
    <div id="nomadVerdict" class="sig-root mb-4" data-note="{{ _('These routes are discovered via HashiCorp Nomad and are read-only. Edit them via your Nomad job definitions.') }}"></div>
    <div id="nomadContent">
        <div class="text-center py-16" style="color:var(--muted)">
            <i class="ph-light ph-spinner-gap text-4xl block mb-3 animate-spin opacity-40"></i>
            <p>{{ _('Loading Nomad routes...') }}</p>
        </div>
    </div>
    <div id="nomadMiddlewares"></div>
</div>

<script src="{{ base_path }}/static/js/tab-nomad.js?v={{ asset_version }}"></script>
