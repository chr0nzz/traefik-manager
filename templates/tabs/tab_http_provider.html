<div id="tab-http_provider" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="text" id="httpProviderSearch" oninput="filterHttpProvider()" placeholder="{{ _('Search HTTP provider routes…') }}" class="input-field pl-9">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="filterHttpProvider('all')"  id="hp-all"  class="proto-btn active-http text-xs px-3 py-1.5">{{ pgettext('button', 'All') }}</button>
            <button onclick="filterHttpProvider('http')" id="hp-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="filterHttpProvider('tcp')"  id="hp-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="filterHttpProvider('udp')"  id="hp-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="refreshHttpProviderTab()" class="proto-btn text-xs px-3 py-1.5" title="{{ pgettext('tooltip', 'Refresh') }}"><i class="ph-bold ph-arrows-clockwise"></i></button>
        </div>
    </div>
    <div id="httpProviderVerdict" class="sig-root mb-4" data-note="{{ _('These routes are sourced from an HTTP endpoint configured in Traefik and are read-only here.') }}"></div>
    <div id="httpProviderContent">
        <div class="text-center py-16" style="color:var(--muted)">
            <i class="ph-light ph-spinner-gap text-4xl block mb-3 animate-spin opacity-40"></i>
            <p>{{ _('Loading HTTP provider routes…') }}</p>
        </div>
    </div>
    <div id="httpProviderMiddlewares"></div>
</div>

<script src="{{ base_path }}/static/js/tab-http_provider.js?v={{ asset_version }}"></script>
