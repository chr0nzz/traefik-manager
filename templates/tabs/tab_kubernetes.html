<div id="tab-kubernetes" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4 items-center filter-bar">
        <div class="relative flex-1 min-w-48">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)"></i>
            <input type="text" id="kubernetesSearch" oninput="filterKubernetes()" placeholder="{{ _('Search Kubernetes routes...') }}" class="input-field pl-9">
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="filterKubernetes('all')"  id="k8s-all"  class="proto-btn active-http text-xs px-3 py-1.5">{{ pgettext('button', 'All') }}</button>
            <button onclick="filterKubernetes('http')" id="k8s-http" class="proto-btn text-xs px-3 py-1.5">HTTP</button>
            <button onclick="filterKubernetes('tcp')"  id="k8s-tcp"  class="proto-btn text-xs px-3 py-1.5">TCP</button>
            <button onclick="filterKubernetes('udp')"  id="k8s-udp"  class="proto-btn text-xs px-3 py-1.5">UDP</button>
        </div>
        <div class="flex gap-1 p-1 rounded-lg" style="background:var(--input-bg); border:1px solid var(--border)">
            <button onclick="refreshKubernetesTab()" class="proto-btn text-xs px-3 py-1.5" title="{{ pgettext('tooltip', 'Refresh') }}"><i class="ph-bold ph-arrows-clockwise"></i></button>
        </div>
    </div>
    <div id="kubernetesVerdict" class="sig-root mb-4" data-note="These routes are managed by Kubernetes (CRD, Ingress, or Gateway API) and are read-only. Edit them via your Kubernetes resources."></div>
    <div id="kubernetesContent">
        <div class="text-center py-16" style="color:var(--muted)">
            <i class="ph-light ph-spinner-gap text-4xl block mb-3 animate-spin opacity-40"></i>
            <p>{{ _('Loading Kubernetes routes...') }}</p>
        </div>
    </div>
    <div id="kubernetesMiddlewares"></div>
</div>

<script src="{{ base_path }}/static/js/tab-kubernetes.js?v={{ asset_version }}"></script>
