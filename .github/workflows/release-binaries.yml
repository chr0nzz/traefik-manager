name: Release Agent Binaries

# Runs as the last stage of docker.yml on a release tag, after the audit and both image pushes
# have succeeded. It no longer listens for a published release: publishing first is what left
# /releases/latest/download pointing at a release with no assets, and it skipped the audit.
# Run it by hand only to rebuild the binaries for a tag that already exists; it audits that
# tag first.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the agent binaries for and publish
        required: true

permissions:
  contents: write
  # Signing the binaries needs an OIDC token and somewhere to record the attestation.
  id-token: write
  attestations: write

jobs:
  # docker.yml already audited the tag before calling this, so only a manual run audits here.
  audit:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/audit.yml
    with:
      ref: ${{ inputs.tag }}

  build-binaries:
    needs: audit
    if: >-
      !cancelled()
      && (needs.audit.result == 'success' || (needs.audit.result == 'skipped' && github.event_name != 'workflow_dispatch'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          # This job runs with contents: write. Without this, checkout leaves the token in
          # .git/config, where anything the build runs afterwards can read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build TMA binaries
        working-directory: agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64       go build -trimpath -ldflags "-s -w" -o dist/tma-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64       go build -trimpath -ldflags "-s -w" -o dist/tma-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o dist/tma-linux-armv7 .
          (cd dist && sha256sum tma-linux-* > SHA256SUMS)
          cat dist/SHA256SUMS

      # SHA256SUMS is generated by this job and uploaded to the same release, so on its own it
      # proves only that the file matches a checksum published beside it. The attestation is
      # rooted outside the release: it is signed with a short-lived certificate tied to this
      # workflow and recorded in a public transparency log, so `gh attestation verify` can tell
      # a real binary from one added to the release afterwards.
      - name: Attest the binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: agent/dist/tma-linux-*

      # A draft prepared for the tag keeps its notes: the assets go on first, then the draft is
      # published and marked latest. An already published release (a manual rebuild) only gets
      # its assets replaced. With neither, the release is created with generated notes.
      - name: Attach binaries and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          assets=(agent/dist/tma-linux-* agent/dist/SHA256SUMS)
          if is_draft="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$TAG" --draft=false --latest
            fi
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes --latest
          fi
