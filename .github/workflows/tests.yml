name: Tests

on:
  push:
    branches:
      - dev
      - "refactor/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app.py core tests

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install translation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext
          npm install --prefix scripts/i18n --no-save --ignore-scripts --no-audit --no-fund acorn@8.18.0

      - name: Check translations
        run: python scripts/i18n/check.py --require-tools

      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest -q --cov=core --cov=app --cov-report=term | tee pytest.out
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^---------/,$p' pytest.out | head -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  weblate-scope:
    if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'weblate' || startsWith(github.head_ref, 'weblate'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Translation pull requests may only change catalogues
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          outside=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -vE '^locale/[A-Za-z]{2,3}(_[A-Za-z0-9]+)*/LC_MESSAGES/messages\.po$' || true)
          if [ -n "$outside" ]; then
            echo "::error::A translation pull request changed files outside locale/<lang>/LC_MESSAGES/messages.po:"
            echo "$outside"
            exit 1
          fi
          echo "Only catalogues changed."

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - name: Build agent
        working-directory: agent
        run: go build ./...

      - name: Vet agent
        working-directory: agent
        run: go vet ./...

      - name: Test agent
        working-directory: agent
        run: go test ./...
